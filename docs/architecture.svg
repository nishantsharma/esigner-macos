<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 812" width="980" height="812"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Windows and macOS side by side: the same eSigner.jar, a different certificate store</title>

  <defs>
    <marker id="dn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/>
    </marker>
    <style>
      .bx   { rx:7; stroke-width:1.4 }
      .same { fill:#f6f8fa; stroke:#d0d7de }
      .jar  { fill:#f0fff4; stroke:#1a7f37; stroke-width:1.8 }
      .fork { fill:#fffbeb; stroke:#bf8700; stroke-width:1.8 }
      .mine { fill:#eef5ff; stroke:#0969da; stroke-width:1.8 }
      .t    { font-size:13; font-weight:600; fill:#1f2328; text-anchor:middle }
      .s    { font-size:10.5; fill:#57606a; text-anchor:middle }
      .m    { font-family:ui-monospace, SFMono-Regular, Menlo, monospace }
    </style>
  </defs>

  <rect width="980" height="812" fill="#ffffff"/>

  <text x="40" y="40" font-size="21" font-weight="600" fill="#1f2328">Same signer, different certificate store</text>
  <text x="40" y="63" font-size="13.5" fill="#57606a">The vendor's jar is identical on both sides. Only what answers one lookup changes.</text>

  <!-- column headers -->
  <rect x="40"  y="88" width="420" height="30" rx="6" fill="#eaeef2"/>
  <text x="250" y="108" class="t">Windows — as the kit ships</text>
  <rect x="520" y="88" width="420" height="30" rx="6" fill="#ddf4ff"/>
  <text x="730" y="108" class="t">macOS — this repository</text>

  <line x1="490" y1="88" x2="490" y2="660" stroke="#d0d7de" stroke-dasharray="4 5"/>

  <!-- arrows down each column -->
  <g stroke="#8c959f" stroke-width="1.4" marker-end="url(#dn)">
    <line x1="250" y1="176" x2="250" y2="200"/><line x1="730" y1="176" x2="730" y2="200"/>
    <line x1="250" y1="246" x2="250" y2="270"/><line x1="730" y1="246" x2="730" y2="270"/>
    <line x1="250" y1="316" x2="250" y2="340"/><line x1="730" y1="316" x2="730" y2="340"/>
    <line x1="250" y1="386" x2="250" y2="410"/><line x1="730" y1="386" x2="730" y2="410"/>
    <line x1="250" y1="456" x2="250" y2="480"/><line x1="730" y1="456" x2="730" y2="480"/>
    <line x1="250" y1="526" x2="250" y2="550"/><line x1="730" y1="526" x2="730" y2="550"/>
    <line x1="250" y1="596" x2="250" y2="620"/><line x1="730" y1="596" x2="730" y2="620"/>
    <line x1="250" y1="666" x2="250" y2="690"/><line x1="730" y1="666" x2="730" y2="690"/>
  </g>

  <!-- row 1 : portal -->
  <rect class="bx same" x="40"  y="132" width="420" height="44"/>
  <text x="250" y="152" class="t">Portal page in the browser</text>
  <text x="250" y="168" class="s">asks for a signature over the tender payload</text>
  <rect class="bx same" x="520" y="132" width="420" height="44"/>
  <text x="730" y="152" class="t">Portal page in the browser</text>
  <text x="730" y="168" class="s">asks for a signature over the tender payload</text>

  <!-- row 2 : extension -->
  <rect class="bx same" x="40"  y="202" width="420" height="44"/>
  <text x="250" y="222" class="t">eSigner browser extension</text>
  <text x="250" y="238" class="s">the same extension, from the portal</text>
  <rect class="bx same" x="520" y="202" width="420" height="44"/>
  <text x="730" y="222" class="t">eSigner browser extension</text>
  <text x="730" y="238" class="s">the same extension, from the portal</text>

  <!-- row 3 : how the host is registered and launched -->
  <rect class="bx same" x="40"  y="272" width="420" height="44"/>
  <text x="250" y="292" class="t">Native messaging host</text>
  <text x="250" y="308" class="s">registered in the registry; launched by a <tspan class="m">.bat</tspan></text>
  <rect class="bx mine" x="520" y="272" width="420" height="44"/>
  <text x="730" y="292" class="t">Native messaging host</text>
  <text x="730" y="308" class="s">a JSON manifest; launched by <tspan class="m">run-host.sh</tspan></text>

  <!-- row 4 : the jar -->
  <rect class="bx jar" x="40"  y="342" width="420" height="44"/>
  <text x="250" y="362" class="t"><tspan class="m">eSigner.jar</tspan></text>
  <text x="250" y="378" class="s">the vendor's signer</text>
  <rect class="bx jar" x="520" y="342" width="420" height="44"/>
  <text x="730" y="362" class="t"><tspan class="m">eSigner.jar</tspan></text>
  <text x="730" y="378" class="s">the same file, byte for byte — not patched</text>

  <!-- row 5 : the fork -->
  <rect class="bx fork" x="40"  y="412" width="420" height="44"/>
  <text x="250" y="432" class="t m" font-size="12.5">KeyStore.getInstance("Windows-MY")</text>
  <text x="250" y="448" class="s">hardcoded, in two places</text>
  <rect class="bx fork" x="520" y="412" width="420" height="44"/>
  <text x="730" y="432" class="t m" font-size="12.5">KeyStore.getInstance("Windows-MY")</text>
  <text x="730" y="448" class="s">the same call, answered differently</text>

  <!-- row 6 : the provider -->
  <rect class="bx same" x="40"  y="482" width="420" height="44"/>
  <text x="250" y="502" class="t">Provider <tspan class="m">SunMSCAPI</tspan></text>
  <text x="250" y="518" class="s">ships inside the JDK — on Windows only</text>
  <rect class="bx mine" x="520" y="482" width="420" height="44"/>
  <text x="730" y="502" class="t"><tspan class="m">MacSignerProvider</tspan></text>
  <text x="730" y="518" class="s">registered under the name <tspan class="m">SunMSCAPI</tspan></text>

  <!-- row 7 : the keystore -->
  <rect class="bx same" x="40"  y="552" width="420" height="44"/>
  <text x="250" y="572" class="t">Windows certificate store</text>
  <text x="250" y="588" class="s">the <tspan class="m">Windows-MY</tspan> store, filled by the driver</text>
  <rect class="bx mine" x="520" y="552" width="420" height="44"/>
  <text x="730" y="572" class="t"><tspan class="m">TokenKeyStore</tspan> → <tspan class="m">SunPKCS11</tspan></text>
  <text x="730" y="588" class="s">named <tspan class="m">Windows-MY</tspan>, reading the token over PKCS#11</text>

  <!-- row 8 : the vendor module -->
  <rect class="bx same" x="40"  y="622" width="420" height="44"/>
  <text x="250" y="642" class="t">CSP / minidriver</text>
  <text x="250" y="658" class="s">vendor code, installed system-wide</text>
  <rect class="bx same" x="520" y="622" width="420" height="44"/>
  <text x="730" y="642" class="t m" font-size="12.5">libcastle*.dylib</text>
  <text x="730" y="658" class="s">the same vendor's module — no root, no kext</text>

  <!-- the token, shared -->
  <rect x="40" y="692" width="900" height="52" rx="8" fill="#fffbeb" stroke="#bf8700" stroke-width="1.8"/>
  <text x="490" y="714" class="t" fill="#7a4d00">One DSC token</text>
  <text x="490" y="732" class="s" fill="#8a6d3b">The same physical token either way — the private key never leaves the chip, and the signature is computed inside it.</text>

  <!-- legend -->
  <g font-size="11" fill="#57606a">
    <rect x="40"  y="768" width="11" height="11" rx="2" class="same" stroke-width="1.2"/>
    <text x="58"  y="778">unchanged — the vendor's, or the platform's</text>
    <rect x="330" y="768" width="11" height="11" rx="2" class="jar"/>
    <text x="348" y="778">the vendor's jar, untouched</text>
    <rect x="560" y="768" width="11" height="11" rx="2" class="mine"/>
    <text x="578" y="778">written here — about 700 lines of Java and shell</text>
  </g>
</svg>
