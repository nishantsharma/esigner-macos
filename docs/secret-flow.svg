<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Where the secrets go: PIN, private key and signature across trust boundaries</title>

  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0969da"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/>
    </marker>
    <marker id="aAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a6700"/>
    </marker>
  </defs>

  <rect width="980" height="700" fill="#ffffff"/>

  <text x="40" y="40" font-size="21" font-weight="600" fill="#1f2328">Where the secrets go</text>
  <text x="40" y="63" font-size="13.5" fill="#57606a">Three things move when you sign. Only one of them ever leaves your Mac.</text>

  <!-- ============================ trust zones ============================ -->
  <rect x="40"  y="92" width="180" height="330" rx="10" fill="#fffbeb" stroke="#bf8700" stroke-width="1.5"/>
  <text x="130" y="116" font-size="13" font-weight="600" fill="#7a4d00" text-anchor="middle">DSC token</text>
  <text x="130" y="133" font-size="11" fill="#8a6d3b" text-anchor="middle">tamper-resistant chip</text>

  <rect x="272" y="92" width="292" height="330" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="418" y="116" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Host process (JVM)</text>
  <text x="418" y="133" font-size="11" fill="#57606a" text-anchor="middle">your account · exits with the tab</text>

  <rect x="616" y="92" width="170" height="330" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="701" y="116" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Chrome + extension</text>
  <text x="701" y="133" font-size="11" fill="#57606a" text-anchor="middle">allow-listed origin only</text>

  <rect x="838" y="92" width="102" height="330" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="889" y="116" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Portal</text>
  <text x="889" y="133" font-size="11" fill="#57606a" text-anchor="middle">the network</text>

  <g stroke="#8c959f" stroke-dasharray="3 4" stroke-width="1">
    <line x1="246" y1="92" x2="246" y2="422"/>
    <line x1="590" y1="92" x2="590" y2="422"/>
    <line x1="812" y1="92" x2="812" y2="422"/>
  </g>
  <g font-size="9.5" fill="#6e7781" text-anchor="middle">
    <text x="246" y="437">USB / PC-SC</text>
    <text x="590" y="437">stdio pipe</text>
    <text x="812" y="437">HTTPS</text>
  </g>

  <!-- ==================== 1. document in (blue, leftward) ==================== -->
  <text x="284" y="178" font-size="11.5" font-weight="600" fill="#0969da">1 · What you are signing</text>
  <text x="700" y="178" font-size="11" fill="#0969da" text-anchor="middle">bid data, as JSON</text>
  <line x1="920" y1="196" x2="330" y2="196" stroke="#0969da" stroke-width="2" marker-end="url(#aBlue)"/>

  <!-- ==================== 2. PIN (amber, into the token) ==================== -->
  <text x="284" y="243" font-size="11.5" font-weight="600" fill="#9a6700">2 · Your PIN</text>
  <rect x="340" y="253" width="150" height="34" rx="6" fill="#fff8dc" stroke="#bf8700"/>
  <text x="415" y="269" font-size="11" fill="#7a4d00" text-anchor="middle">PIN dialog</text>
  <text x="415" y="281" font-size="9.5" fill="#8a6d3b" text-anchor="middle">char[] in memory</text>
  <text x="415" y="303" font-size="10" fill="#57606a" text-anchor="middle">typed by you, zeroed after use</text>
  <line x1="340" y1="270" x2="228" y2="270" stroke="#9a6700" stroke-width="2" marker-end="url(#aAmber)"/>
  <text x="284" y="262" font-size="10" fill="#9a6700" text-anchor="middle">C_Login</text>
  <line x1="536" y1="252" x2="536" y2="290" stroke="#cf222e" stroke-width="2"/>
  <text x="544" y="275" font-size="10" fill="#cf222e">never crosses</text>

  <!-- ==================== 3. private key (stays put) ==================== -->
  <text x="60" y="322" font-size="11.5" font-weight="600" fill="#cf222e">3 · Private key</text>
  <rect x="60" y="334" width="140" height="52" rx="6" fill="#fff5f5" stroke="#cf222e"/>
  <text x="130" y="354" font-size="11" fill="#82071e" text-anchor="middle">RSA private key</text>
  <text x="130" y="370" font-size="9.5" fill="#a40e26" text-anchor="middle">signs on-chip, non-extractable</text>
  <line x1="232" y1="334" x2="232" y2="386" stroke="#cf222e" stroke-width="2.5"/>
  <text x="240" y="364" font-size="10" fill="#cf222e">never leaves</text>

  <!-- ==================== 4. signature out (green, rightward) ==================== -->
  <text x="284" y="399" font-size="11.5" font-weight="600" fill="#1a7f37">4 · What comes back</text>
  <text x="700" y="399" font-size="11" fill="#1a7f37" text-anchor="middle">CMS signature + your public certificate</text>
  <line x1="228" y1="414" x2="930" y2="414" stroke="#1a7f37" stroke-width="2" marker-end="url(#aGreen)"/>

  <!-- ============================ notes ============================ -->
  <line x1="40" y1="470" x2="940" y2="470" stroke="#d0d7de"/>

  <g font-size="12">
    <text x="40" y="497" font-size="12.5" font-weight="600" fill="#1a7f37">What this protects</text>
    <text x="40" y="520" fill="#57606a">• The private key is generated on the token and cannot be exported. Java holds only a handle</text>
    <text x="52" y="537" fill="#57606a">(<tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">P11Key$P11RSAPrivateKeyInternal</tspan>) — the signature is computed inside the chip.</text>
    <text x="40" y="558" fill="#57606a">• The PIN is held in a <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">char[]</tspan>, zeroed in a <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">finally</tspan> block, and passed only to the token — never</text>
    <text x="52" y="575" fill="#57606a">written to disk, never logged, never returned to the browser.</text>
    <text x="40" y="596" fill="#57606a">• Only the allow-listed extension may open the pipe; a random web page cannot reach the host.</text>

    <text x="40" y="628" font-size="12.5" font-weight="600" fill="#cf222e">What it does not</text>
    <text x="40" y="651" fill="#57606a">• One PIN entry unlocks the token for the whole life of the host process, not per signature.</text>
    <text x="40" y="668" fill="#57606a">• The vendor signer uploads over TLS with certificate and hostname checks disabled.</text>
    <text x="40" y="685" fill="#6e7781">Both are inherited from the Windows kit, not introduced here. See SECURITY.md.</text>
  </g>
</svg>
