<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 856" width="1180" height="856"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Where the secrets go: PIN, private key and signature across trust boundaries</title>

  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0969da"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/>
    </marker>
    <marker id="aAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a6700"/>
    </marker>
    <style>
      .mono { font-family:ui-monospace, SFMono-Regular, Menlo, monospace }
    </style>
  </defs>

  <rect width="1180" height="856" fill="#ffffff"/>

  <text x="44" y="50" font-size="27" font-weight="600" fill="#1f2328">Where the secrets go</text>
  <text x="44" y="80" font-size="17" fill="#57606a">Three things move when you sign. Only one of them ever leaves your Mac.</text>

  <!-- ============================ trust zones ============================ -->
  <rect x="44"  y="116" width="216" height="396" rx="11" fill="#fffbeb" stroke="#bf8700" stroke-width="1.8"/>
  <text x="152" y="146" font-size="16" font-weight="600" fill="#7a4d00" text-anchor="middle">DSC token</text>
  <text x="152" y="167" font-size="13.5" fill="#8a6d3b" text-anchor="middle">tamper-resistant chip</text>

  <rect x="323" y="116" width="360" height="396" rx="11" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.8"/>
  <text x="503" y="146" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">Host process (JVM)</text>
  <text x="503" y="167" font-size="13.5" fill="#57606a" text-anchor="middle">your account · exits with the tab</text>

  <rect x="746" y="116" width="212" height="396" rx="11" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.8"/>
  <text x="852" y="146" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">Chrome + extension</text>
  <text x="852" y="167" font-size="13.5" fill="#57606a" text-anchor="middle">allow-listed origin only</text>

  <rect x="1010" y="116" width="126" height="396" rx="11" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.8"/>
  <text x="1073" y="146" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">Portal</text>
  <text x="1073" y="167" font-size="13.5" fill="#57606a" text-anchor="middle">the network</text>

  <g stroke="#8c959f" stroke-dasharray="3 5" stroke-width="1.2">
    <line x1="292" y1="116" x2="292" y2="512"/>
    <line x1="714" y1="116" x2="714" y2="512"/>
    <line x1="984" y1="116" x2="984" y2="512"/>
  </g>
  <g font-size="12.5" fill="#6e7781" text-anchor="middle">
    <text x="292" y="533">USB / PC-SC</text>
    <text x="714" y="533">stdio pipe</text>
    <text x="984" y="533">HTTPS</text>
  </g>

  <!-- ==================== 1. document in (blue, leftward) ==================== -->
  <text x="338" y="215" font-size="15" font-weight="600" fill="#0969da">1 · What you are signing</text>
  <text x="850" y="215" font-size="14.5" fill="#0969da" text-anchor="middle">bid data, as JSON</text>
  <line x1="1112" y1="238" x2="396" y2="238" stroke="#0969da" stroke-width="2.4" marker-end="url(#aBlue)"/>

  <!-- ==================== 2. PIN (amber, into the token) ==================== -->
  <text x="338" y="296" font-size="15" font-weight="600" fill="#9a6700">2 · Your PIN</text>
  <rect x="410" y="309" width="186" height="44" rx="7" fill="#fff8dc" stroke="#bf8700" stroke-width="1.6"/>
  <text x="503" y="329" font-size="14.5" fill="#7a4d00" text-anchor="middle">PIN dialog</text>
  <text x="503" y="345" font-size="12.5" fill="#8a6d3b" text-anchor="middle" class="mono">char[] in memory</text>
  <text x="503" y="374" font-size="13.5" fill="#57606a" text-anchor="middle">typed by you, zeroed after use</text>
  <line x1="410" y1="331" x2="272" y2="331" stroke="#9a6700" stroke-width="2.4" marker-end="url(#aAmber)"/>
  <text x="340" y="322" font-size="13" fill="#9a6700" text-anchor="middle" class="mono">C_Login</text>
  <line x1="650" y1="306" x2="650" y2="356" stroke="#cf222e" stroke-width="2.6"/>
  <text x="661" y="335" font-size="13.5" fill="#cf222e">never crosses</text>

  <!-- ==================== 3. private key (stays put) ==================== -->
  <text x="68" y="398" font-size="15" font-weight="600" fill="#cf222e">3 · Private key</text>
  <rect x="60" y="412" width="188" height="62" rx="7" fill="#fff5f5" stroke="#cf222e" stroke-width="1.6"/>
  <text x="154" y="436" font-size="14.5" fill="#82071e" text-anchor="middle">RSA private key</text>
  <text x="154" y="455" font-size="12" fill="#a40e26" text-anchor="middle">signs on-chip, non-extractable</text>
  <line x1="266" y1="412" x2="266" y2="474" stroke="#cf222e" stroke-width="2.8"/>
  <text x="277" y="447" font-size="13.5" fill="#cf222e">never leaves</text>

  <!-- ==================== 4. signature out (green, rightward) ==================== -->
  <text x="338" y="484" font-size="15" font-weight="600" fill="#1a7f37">4 · What comes back</text>
  <text x="850" y="484" font-size="14.5" fill="#1a7f37" text-anchor="middle">CMS signature + your public certificate</text>
  <line x1="272" y1="502" x2="1124" y2="502" stroke="#1a7f37" stroke-width="2.4" marker-end="url(#aGreen)"/>

  <!-- ============================ notes ============================ -->
  <line x1="44" y1="576" x2="1136" y2="576" stroke="#d0d7de"/>

  <g font-size="15" fill="#57606a">
    <text x="44" y="610" font-size="16.5" font-weight="600" fill="#1a7f37">What this protects</text>
    <text x="44" y="642">• The private key is generated on the token and cannot be</text>
    <text x="58" y="665">exported. Java holds only a handle</text>
    <text x="58" y="688">(<tspan class="mono" font-size="14">P11Key$P11RSAPrivateKeyInternal</tspan>) — it signs inside the chip.</text>
    <text x="44" y="722">• The PIN is held in a <tspan class="mono" font-size="14">char[]</tspan>, zeroed in a <tspan class="mono" font-size="14">finally</tspan> block, and</text>
    <text x="58" y="745">passed only to the token — never written to disk, never</text>
    <text x="58" y="768">logged, never returned to the browser.</text>
    <text x="44" y="802">• Only the allow-listed extension may open the pipe; a</text>
    <text x="58" y="825">random web page cannot reach the host.</text>

    <text x="648" y="610" font-size="16.5" font-weight="600" fill="#cf222e">What it does not</text>
    <text x="648" y="642">• One PIN entry unlocks the token for the whole life</text>
    <text x="662" y="665">of the host process, not per signature.</text>
    <text x="648" y="699">• DXC's signer uploads over TLS with certificate</text>
    <text x="662" y="722">and hostname checks disabled.</text>
    <text x="648" y="768" font-size="14" fill="#6e7781">Both are inherited from the Windows kit, not</text>
    <text x="648" y="789" font-size="14" fill="#6e7781">introduced here. See SECURITY.md.</text>
  </g>
</svg>
